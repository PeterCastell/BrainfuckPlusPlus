# The relative path to the main file / entry point.
main="main.bfpp"

# All outputs listed will be generated on build.
# Allowed values: "zig", "bf"
outputs=["zig"]

## All options below are optional and set here to the default values.

# options in [common] apply to all outputs.
# These options can be written in the other
# sections to override for individual outputs.
[common]
include_comments = true
include_formatting = true
# Number of cells on the tape. When unset each output uses its default
# (zig: as many cells as fit in 32 GiB of virtual memory).
# tape_size = 30000
# Features to leave out, for targets that don't support them.
# Using a disabled feature is a compile error.
# disabled_features = [
#     "extern_functions",
#     "threads",
#     "mutexes",
#     "raw_input"
# ]

# Options for generating a zig project.
[zig]
args=[] # Args for the zig compiler
build_after_template = true
#   Path to the zig executable (or the folder containing it),
#   relative to this file. If not set, bfpp checks the BFPP_ZIG
#   environment variable, then a zig folder next to bfpp, then PATH.
# zig_path = "path/to/zig"
cell_size = 1 # in bytes
# "virtual": reserve the tape in virtual memory, pages are only used once touched.
# "static": the tape is a zeroed global array; set tape_size to something that fits in RAM.
tape_allocation = "virtual"
# Folder with replacements for template.zig, build.zig, build.zig.zon or DynLib.zig,
# relative to this file.
# template_overrides = "zig-template"
#   Certain failures which would stop execution by default
#   can be ignored. Failures would simply not modify the tape.
# ignore_error = [
#     "findExternFunction",
#     "createExternCaller"
# ]

# Options for outputing a single processed .bfpp file.
[bf]
include_debug_operators=true
compact_operators=true # use numerable operators and for loops

[launch]
# Args for the compiled output
args=[]